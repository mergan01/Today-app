name: Build Today IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Folder Structure
        run: |
          mkdir -p Payload/Today.app
          cp Info.plist Payload/Today.app/Info.plist

          # Bindet dein lila AppIcon direkt in die App ein
          if [ -f "AppIcon.png" ]; then
            cp AppIcon.png Payload/Today.app/AppIcon.png
          fi

          cat << 'EOF' > Payload/Today.app/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta http-equiv="refresh" content="0; url='https://mergan01.github.io/Today-app/'">
          </head>
          <body>
              <script>window.location.href = "https://mergan01.github.io/Today-app/";</script>
          </body>
          </html>
          EOF

      - name: Compress to IPA
        run: |
          zip -r Today.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Today.ipa
          path: Today.ipa
